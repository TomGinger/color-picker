<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Pick a color and generate a color scheme using The Color API.">
        <title>Color Scheme Selector</title>
        <script>
            // Apply saved / system theme before first paint to avoid a flash of the wrong theme
            (function () {
                const saved = localStorage.getItem("theme");
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (saved === "dark" || (!saved && prefersDark)) {
                    document.documentElement.classList.add("dark-mode");
                }
            })();
        </script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <div class="container">

            <div class="header-container">
                <h1>Color Scheme Selector</h1>
                <button id="dark-mode-btn" class="icon-btn" type="button" aria-label="Toggle dark mode">
                    <i id="dark-mode-icon" class="fa-solid fa-moon" aria-hidden="true"></i>
                </button>
            </div>

            <form id="color-form" class="color-form">

                <input id="color-hex-value" type="color" value="#1219e0" aria-label="Base color">

                <select id="color-scheme" aria-label="Color scheme">
                    <option value="monochrome" selected>Monochrome</option>
                    <option value="monochrome-dark">Monochrome dark</option>
                    <option value="monochrome-light">Monochrome light</option>
                    <option value="analogic">Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">Analogic complement</option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>

                <button id="color-btn" type="submit">Get color scheme</button>

            </form>

            <div id="copy-message" aria-live="polite"></div>

            <div id="color-bg-container" class="grid-container"></div>
            <div id="color-text-container" class="grid-container"></div>
        </div>
        <script type="module" src="./index.js"></script>
    </body>
</html>
